[package]
name = "blackhole-mailbox"
description = "Blackhole rendezvous (mailbox) server"

version.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license = "MIT"

rust-version.workspace = true
edition.workspace = true

[[bin]]
name = "blackhole-mailbox"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "signal", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rand = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "test-util"] }
