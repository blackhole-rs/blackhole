[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # Inherited from upstream's async-tungstenite -> async-tls -> rustls 0.21 chain.
    # Not reachable from our code path: servers terminate TLS at the reverse proxy
    # rather than through rustls-webpki, and the wormhole client uses TLS only when
    # `tls`/`native-tls` features are explicitly enabled (default is plain ws://).
    # Will resolve when async-tungstenite upgrades its rustls dep.
    "RUSTSEC-2026-0098", # rustls-webpki: URI name constraints accepted (not used)
    "RUSTSEC-2026-0099", # rustls-webpki: wildcard name constraints (not used)
    "RUSTSEC-2026-0104", # rustls-webpki: panic in CRL parsing (CRLs not used)
]
unmaintained = "workspace"

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "EUPL-1.2",
]

[licenses.private]
ignore = false
registries = []

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
